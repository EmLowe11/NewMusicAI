[build]
  publish = "public"
  functions = "netlify/functions"
  # No build step needed — static frontend + serverless functions.
  command = ""

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
